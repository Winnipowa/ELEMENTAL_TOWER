<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elemental Tower — Portrait Mobile v0.5</title>
<style>
:root { color-scheme: dark; }
html, body { height: 100%; }
:root {
  --bg: #0d0f14;
  --panel: rgba(14, 18, 28, 0.86);
  --line: rgba(255, 255, 255, 0.14);
  --text: #eef2ff;
  --muted: #9aa4bf;
  --gold: #ffd84a;
  --accent: #5b8cff;
  --danger: #ff5a5a;
  --good: #6aff8a;
  --fire: #ff6a2b; --water: #3fa7ff; --earth: #b07a45; --wind: #9df0c8; --gen: #f2c94c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
button { font: inherit; color: var(--text); background: #232a3d; border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; touch-action: manipulation; }
button:hover:not(:disabled) { background: #2e3750; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: #8a2b2b; border-color: #c24a4a; font-weight: 600; }
button.primary:hover { background: #a33636; }

/* ---------------------------------------------------------------- barre du haut */
#hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
  padding: 6px max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
  background: linear-gradient(var(--panel), rgba(14, 18, 28, 0.55)); pointer-events: none; }
#hud-top > * { pointer-events: auto; }
.stat { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.stat small { color: var(--muted); font-size: 12px; }
.stat .ico { font-size: 15px; }
.gold .ico, .gold b { color: var(--gold); }
.gold b { font-size: 18px; min-width: 3ch; }
.castle .ico { color: #6fb8ff; }
.demon .ico { color: #ff6a6a; }
.wave { flex-direction: column; gap: 0; align-items: flex-start; }
.btns { margin-left: auto; display: flex; gap: 6px; }
.eco { flex-direction: column; gap: 2px; align-items: stretch; min-width: 150px; }
.eco-line { display: flex; align-items: baseline; gap: 5px; }
.eco-lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.eco b { color: var(--good); font-size: 16px; }
#inc-detail { color: #9fe8b4; }
.cycle { position: relative; height: 12px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
.cycle i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #b8901c, var(--gold)); }
.cycle small { position: absolute; inset: 0; font-size: 10px; line-height: 12px; text-align: center; color: #fff; text-shadow: 0 0 3px #000; }
.eco.idle .cycle i { background: #5a5f70; }
.unit-btn .inc { font-size: 11px; color: var(--good); font-weight: 700; }
.toast.income { border-color: var(--good); color: #c9ffd6; font-weight: 700; background: rgba(20,60,34,.92); }
.panel .ecobox { background: rgba(106,255,138,.08); border: 1px solid rgba(106,255,138,.35); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.panel textarea { width: 100%; height: 70px; font: 11px monospace; background: #0b0e16; color: #cfd6ea; border: 1px solid var(--line); border-radius: 6px; }

/* ---------------------------------------------------------------- armée */
#hud-army { position: fixed; bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; }
.army-label { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
#hud-army .row { display: flex; gap: 4px; }
.chip { padding: 4px 8px; border-radius: 999px; font-size: 12px; display: flex; gap: 4px; align-items: center; }
.chip.active { outline: 2px solid #fff; background: #3a4566; }
.chip .rk { font-weight: 700; font-size: 11px; opacity: .85; }
.el-fire { border-color: var(--fire); } .el-water { border-color: var(--water); }
.el-earth { border-color: var(--earth); } .el-wind { border-color: var(--wind); } .el-generator { border-color: var(--gen); }
.chip.el-fire .nm { color: var(--fire); } .chip.el-water .nm { color: var(--water); }
.chip.el-earth .nm { color: #d9a46f; } .chip.el-wind .nm { color: var(--wind); }
.unit-btn { display: flex; flex-direction: column; align-items: center; padding: 4px 10px; min-width: 84px; }
.unit-btn .cost { font-size: 11px; color: var(--gold); }

/* ---------------------------------------------------------------- menu de case */
#popup { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px; max-width: 320px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.pop-title { font-weight: 700; margin-bottom: 6px; }
.pop-info { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pop-hint { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 6px; }
.pop-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.build-btn { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-width: 2px; min-width: 56px; }
.build-btn span { font-size: 11px; color: var(--gold); }
.sell-btn { width: 100%; border-color: var(--gold); }

/* ---------------------------------------------------------------- messages */
#toasts { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column;
  align-items: center; gap: 4px; pointer-events: none; z-index: 4; }
.toast { background: var(--panel); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px;
  font-size: 13px; animation: fade 2.6s forwards; }
.toast.error { border-color: var(--danger); color: #ffc0c0; }
.toast.good { border-color: var(--good); color: #c9ffd6; }
.toast.warn { border-color: #ff9a3a; color: #ffd9b0; }
@keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }

#pause-banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 800; letter-spacing: .1em;
  background: rgba(10, 14, 30, .75); padding: 8px 18px; border-radius: 10px; display: none; pointer-events: none; }
body.paused #pause-banner { display: block; }

/* ---------------------------------------------------------------- écrans */
#overlay { position: fixed; inset: 0; z-index: 10; background: rgba(5, 7, 12, .7); display: flex; align-items: center;
  justify-content: center; padding: 12px; }
#overlay[hidden] { display: none; }
.panel { background: #141a28; border: 1px solid var(--line); border-radius: 16px; padding: 16px 22px; max-width: 640px;
  max-height: 100%; overflow: auto; }
.panel h1 { margin: 0 0 4px; letter-spacing: .12em; }
.panel .sub { color: var(--muted); margin: 0 0 8px; }
.panel ul { padding-left: 18px; margin: 6px 0; }
.panel li { margin: 4px 0; }
.panel .keys { color: var(--muted); font-size: 12px; }
.panel table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; }
.panel td { padding: 3px 0; border-bottom: 1px solid var(--line); }
.panel td:last-child { text-align: right; font-weight: 600; }
.end { text-align: center; min-width: 300px; }
.end.win h1 { color: var(--good); }
.end.lose h1 { color: var(--danger); }
button.big { display: block; margin: 10px auto 0; padding: 10px 28px; font-size: 16px; font-weight: 700; background: var(--accent); border: none; }

#rotate { display: none; position: fixed; inset: 0; z-index: 20; background: var(--bg); align-items: center; justify-content: center;
  text-align: center; font-size: 20px; }
#rotate div { font-size: 18px; }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }

/* ---------------------------------------------------------------- petits écrans (mobile paysage) */
@media (max-height: 500px) {
  body { font-size: 12px; }
  #hud-top { gap: 8px; padding-top: 3px; padding-bottom: 3px; }
  .gold b { font-size: 15px; }
  .stat small { font-size: 10px; }
  button { padding: 4px 7px; border-radius: 6px; }
  #hud-army { gap: 6px; padding: 4px 6px; bottom: 2px; }
  .army-label { display: none; }
  .chip { padding: 3px 6px; font-size: 11px; }
  .unit-btn { min-width: 64px; padding: 2px 6px; }
  #toasts { top: 36px; }
  .panel { padding: 10px 14px; }
  .panel li { margin: 2px 0; }
}
@media (max-width: 760px) {
  .wave small, #income { display: none; }
  .stat.castle span:last-child, .stat.demon span:last-child { font-size: 11px; }
}
.chip, .unit-btn .cost { white-space: nowrap; }
@media (max-height: 500px) {
  .unit-btn b { font-size: 11px; }
  .unit-btn .cost, .unit-btn .inc { font-size: 10px; }
  .eco { min-width: 120px; }
  .eco b { font-size: 13px; }
  #inc-detail { display: none; }
}


/* v0.5 — Application mobile en portrait : surface de jeu entre les deux HUD. */
#rotate { display: none !important; }
#game { left: 50%; right: auto; transform: translateX(-50%); top: 110px; bottom: 164px;
  width: min(100%, 460px); height: auto; }
#hud-top { left: 50%; right: auto; transform: translateX(-50%); width: min(100%, 460px);
  display: grid; grid-template-columns: 0.85fr 1fr 1fr; gap: 4px 8px;
  padding: max(5px, env(safe-area-inset-top)) 9px 7px; background: #141a28; z-index: 3; }
#hud-top .stat { min-width: 0; }
#hud-top .gold { grid-area: 1 / 1; }
#hud-top .eco { grid-area: 1 / 2; min-width: 0; }
#hud-top .wave { grid-area: 1 / 3; }
#hud-top .castle { grid-area: 2 / 1; }
#hud-top .demon { grid-area: 2 / 2 / 3 / 4; }
#hud-top .btns { grid-area: 3 / 1 / 4 / 4; margin: 0; width: 100%; display: flex; gap: 5px; }
#hud-top .btns button { min-height: 35px; min-width: 35px; padding: 6px 8px; }
#btn-wave { flex: 1; font-size: 12px; min-width: 0 !important; }
#hud-top .gold b { font-size: 18px; min-width: 0; }
#hud-top .eco b { font-size: 14px; }
#hud-top .eco .eco-lbl, #hud-top .stat small { font-size: 10px; }
#hud-top .wave { white-space: nowrap; font-size: 12px; }
#hud-top .castle, #hud-top .demon { font-size: 11px; white-space: nowrap; }
#hud-top #inc-detail, #hud-top #wave-info { display: none; }
#hud-army { left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 460px);
  display: grid; grid-template-columns: 1fr; gap: 5px; padding: 7px 9px max(7px, env(safe-area-inset-bottom));
  border-radius: 12px 12px 0 0; background: #141a28; z-index: 3; }
#hud-army .army-label { display: none; }
#hud-army .row { display: grid; gap: 5px; width: 100%; }
#army-elements { grid-template-columns: repeat(5, minmax(0, 1fr)); }
#army-roads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#army-classes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
#army-elements .chip { min-width: 0; min-height: 38px; flex-direction: column; justify-content: center; gap: 1px;
  padding: 3px 2px; font-size: 10px; line-height: 1.1; border-radius: 8px; }
#army-elements .chip .nm { overflow: hidden; max-width: 100%; text-overflow: ellipsis; }
#army-roads .chip { justify-content: center; min-height: 28px; font-size: 11px; }
#army-classes .unit-btn { min-width: 0; min-height: 53px; padding: 3px 2px; }
#army-classes .unit-btn b { font-size: 12px; }
#army-classes .unit-btn .cost, #army-classes .unit-btn .inc { font-size: 10px; }
#popup { left: 50% !important; top: auto !important; bottom: var(--portrait-popup-bottom, 168px);
  width: min(94vw, 420px); max-width: 420px; transform: translateX(-50%); z-index: 6; }
#popup .pop-grid { grid-template-columns: repeat(4, 1fr); }
#popup .build-btn { min-width: 0; min-height: 46px; }
#toasts { top: calc(var(--portrait-top, 110px) + 5px); max-width: 90vw; }
#toasts .toast { text-align: center; }
#pause-banner { z-index: 2; }
#overlay { padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
.panel { width: min(100%, 460px); max-height: 96%; }
@media (orientation: landscape) and (max-height: 600px) { #rotate { display: flex !important; } }
@media (max-height: 670px) and (orientation: portrait) {
  #hud-top .cycle { height: 8px; }
  #hud-top .cycle small { display: none; }
  #hud-top .btns button { min-height: 30px; }
  #hud-army { gap: 3px; padding-top: 4px; }
  #army-elements .chip { min-height: 31px; }
  #army-roads .chip { min-height: 25px; }
  #army-classes .unit-btn { min-height: 43px; }
}
</style>

  <canvas id="game"></canvas>

  <div id="hud-top">
    <div class="stat gold" title="Or disponible"><span class="ico">●</span><b id="gold">260</b></div>
    <div class="stat eco" title="Revenu périodique : versé toutes les 10 s de combat. Chaque unité envoyée l'augmente pour toute la partie.">
      <div class="eco-line"><span class="eco-lbl">Revenu</span><b id="inc">+30</b><small id="inc-unit">/ 10 s</small><small id="inc-detail"></small></div>

    <div class="stat castle" title="Votre château"><span class="ico">♜</span><span id="php"></span></div>

<script type="module">

// ===== src/config/version.js =====
// Version du build, affichée dans l'écran d'aide.
const VERSION = '0.5.0-portrait';

// ===== src/config/balance.js =====
// =============================================================================
// ELEMENTAL TOWER — Équilibrage centralisé
// -----------------------------------------------------------------------------
// Toutes les valeurs numériques du jeu sont ici.
//   [MB]  = valeur issue du Mainbook (chapitres 03 / 05 ou annexe des décisions)
//   [PROV] = valeur provisoire choisie pour le prototype (à équilibrer en test)
// Aucune logique ici : uniquement des données.
// =============================================================================

const BALANCE = {
  // --------------------------------------------------------------- Économie
  // VARIANTE B (v0.4, inspirée de Stronghold TD) : AUCUNE MINE, AUCUN PLAFOND.
  // Le revenu périodique ne grandit que par les unités offensives envoyées.
  economy: {
    startGold: 260,                // [MB] B05
    cycleSeconds: 10,              // [PROV] un versement toutes les N s de temps économique actif
    baseIncomePerCycle: 30,        // [PROV] = 3 or/s du v0.3, pour comparer A et B
    sellRatio: 0.5,                // [MB] B10 : revente = 50 % de l'investissement total
    unitKillRewardRatio: 1.0,      // [PROV] part de la prime versée quand un démon est tué par une unité
    // Pas de plafond : aucune clé de limite ici, volontairement.
  },

  // --------------------------------------------------------------- Pression (anti-attente, sans plafond)
  pressure: {
    enrageAfter: 45,               // [PROV] s de vie d'un démon avant la rage
    enrageSpeedMult: 2,            // [PROV] vitesse ×2 et insensible ralentissement/étourdissement/recul
    fortifyPerCycle: 0.01,         // [PROV] +1 % PV max et dégâts des défenses démoniaques par versement
    earlyLaunchBonusBase: 20,      // [PROV] prime d'anticipation = base + parWave × n° de vague
    earlyLaunchBonusPerWave: 4,
  },

  // --------------------------------------------------------------- Tourelles
  maxRank: 5,                      // [MB] M09 / M10

  // Multiplicateurs appliqués selon le rang (index 0 = rang 1). [PROV]
  towerRank: {
    damage:   [1, 2.1, 4.4, 9.2, 19],
    range:    [1, 1.06, 1.12, 1.18, 1.25],
    cooldown: [1, 0.97, 0.94, 0.9, 0.85],
    effect:   [1, 1.15, 1.3, 1.45, 1.6],   // intensité des effets (durée, ralentissement…)
  },

  // Modificateurs de dégâts selon la cible. [PROV]
  // Règle anti-aérienne : toutes les tourelles touchent les volants, mais pas avec la même efficacité.
  targetModifiers: {
    fire:  { air: 1.0, heavy: 1.0 },
    water: { air: 1.0, heavy: 1.0 },
    earth: { air: 0.5, heavy: 1.5 },   // [MB] efficace contre les résistants
    wind:  { air: 1.6, heavy: 0.7 },   // [MB] efficace contre les volants
  },

  // Quatre éléments [MB] chapitre 03 (dégâts, cadence, portée, coût)
  elements: {
    fire:  { name: 'Feu',   color: '#ff6a2b', cost: 120, damage: 22, cooldown: 0.75, range: 155,
             effect: { type: 'burn', dpsRatio: 0.3, duration: 2 } },          // [PROV] brûlure
    water: { name: 'Eau',   color: '#3fa7ff', cost: 120, damage: 13, cooldown: 0.58, range: 155,
             effect: { type: 'slow', amount: 0.3, duration: 1.2 } },          // [PROV] ralentissement
    earth: { name: 'Terre', color: '#9b6b3c', cost: 150, damage: 33, cooldown: 1.40, range: 125,
             effect: null },
    wind:  { name: 'Vent',  color: '#9df0c8', cost: 140, damage: 10, cooldown: 0.40, range: 175,
             effect: null },
  },

  // Six hybrides [MB] recettes + pouvoirs ; statistiques [PROV]
  hybrids: {
    steam:      { name: 'Vapeur', recipe: ['fire', 'water'], damage: 16, cooldown: 0.8, range: 150,
                  effect: { type: 'slowZone', radius: 60, amount: 0.45, duration: 2.0 } },
    magma:      { name: 'Magma', recipe: ['fire', 'earth'], damage: 30, cooldown: 1.2, range: 135,
                  effect: { type: 'burnZone', radius: 45, dps: 14, duration: 3.0 } },
    firestorm:  { name: 'Tempête de feu', recipe: ['fire', 'wind'], damage: 18, cooldown: 0.7, range: 165,
                  effect: { type: 'multi', targets: [3, 3, 4, 4, 5] } },
    mud:        { name: 'Boue', recipe: ['water', 'earth'], damage: 22, cooldown: 1.0, range: 140,
                  effect: { type: 'stun', duration: 0.7, immunity: 1.5 } },
    blizzard:   { name: 'Blizzard', recipe: ['water', 'wind'], damage: 14, cooldown: 0.5, range: 165,
                  effect: { type: 'frost', duration: 3.0 } },                 // prochaine attaque ratée
    stonestorm: { name: 'Tempête de pierres', recipe: ['earth', 'wind'], damage: 26, cooldown: 1.1, range: 150,
                  effect: { type: 'knockback', distance: 38, heavyResist: 0.5 } },
  },

  // Les rangs des hybrides débloquent-ils les rangs offensifs de leurs composants ?
  // Le Mainbook (B06, §8) ne compte que les tourelles « de cet élément ». [PROV] désactivé.
  hybridRankUnlocksComponents: false,

  // --------------------------------------------------------------- Unités offensives
  // [MB] chapitre 03.4 : PV, dégâts, cadence, vitesse, coût, portée
  // Variante B : prix baissés ; incomeRatio = coût / bonus de revenu (plus bas = plus rentable).
  units: {
    warrior: { name: 'Guerrier', hp: 85, damage: 13, cooldown: 0.70, speed: 68, cost: 55, range: 24,
               layer: 'ground', hitsAir: false, incomeRatio: 18 },
    archer:  { name: 'Archer',   hp: 45, damage: 10, cooldown: 0.90, speed: 57, cost: 70, range: 145,
               layer: 'ground', hitsAir: true, incomeRatio: 17.5, structureMult: 1.5 },
    flyer:   { name: 'Volant',   hp: 40, damage: 8,  cooldown: 0.65, speed: 90, cost: 90, range: 80,
               layer: 'air', hitsAir: true, incomeRatio: 15 },
  },
  unitAggro: 175,                  // [PROV] distance de détection des structures démoniaques
  // Multiplicateurs selon le rang offensif de l'élément choisi (index 0 = rang 1). [PROV]
  unitRank: {
    hp:     [1, 1.5, 2.1, 2.8, 3.6],
    damage: [1, 1.5, 2.1, 2.8, 3.6],
    cost:   [1, 1.2, 1.4, 1.6, 1.8],
  },
  // Saveur élémentaire des unités offensives. [PROV] — association élément/classe non arbitrée (annexe C)
  unitElements: {
    neutral: { name: 'Neutre' },
    fire:    { name: 'Feu',   damageMult: 1.15, onHit: { type: 'burn', dpsRatio: 0.3, duration: 2 } },
    water:   { name: 'Eau',   onHit: { type: 'slow', amount: 0.3, duration: 1.2 } },
    earth:   { name: 'Terre', hpMult: 1.3 },
    wind:    { name: 'Vent',  speedMult: 1.25, damageMult: 1.05 },
  },

  // --------------------------------------------------------------- Démons
